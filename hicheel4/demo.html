<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <div class="register-box">
        <h1>Create account</h1>
        <div class="form">
            <div class="form-group">
                <label for="name">Name</label><br><br>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div><br><br>
            <div class="form-group">
                <label for="email">Email</label><br><br>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div><br><br>
            <div class="form-group">
                <label for="password">Name</label><br><br>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div><br><br>
            <div class="form-group">
                <label for="repeatpassword">Repeat Password</label><br><br>
                <input type="password" id="repeatpassword" placeholder="Enter your password" required>
            </div><br><br>
            <div class="form-group">
                <label for="contact">Contact</label><br><br>
                <input type="number" id="contact" placeholder="Enter your contact" required>
            </div><br><br>
            
        <div class="gender">
            <label for="gender">Gender</label><br><br>
            <select name="Gender" id="gender">
                    <option value="Male">Male</option>
                    <option value="Female">female</option>
                    <option value="other">other</option>
            </select><br><br>
        </div>
        <div class="terms">
            <input type="checkbox">
            <label for=""> I agree terms and condition</label>
        </div>
        <div class="button">
            <button>Register</button>

        </div>
          
    </div>
  </body>
</html>
