<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chess Board</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ddd;

        display: flex;
        justify-content: center;
        align-items: center;

        height: 100vh;
      }

      .chess {
        width: 640px;
        height: 640px;

        display: grid;

        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);

        border: 4px solid black;
      }

      .box {
        width: 80px;
        height: 80px;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 50px;
      }

      /* ===== COLOR ===== */

      /* 1-р мөр */
      .box:nth-child(-n + 8):nth-child(odd) {
        background: #f0d9b5;
      }

      .box:nth-child(-n + 8):nth-child(even) {
        background: #b58863;
      }

      /* 2-р мөр */
      .box:nth-child(n + 9):nth-child(-n + 16):nth-child(odd) {
        background: #b58863;
      }

      .box:nth-child(n + 9):nth-child(-n + 16):nth-child(even) {
        background: #f0d9b5;
      }

      /* 3-р мөр */
      .box:nth-child(n + 17):nth-child(-n + 24):nth-child(odd) {
        background: #f0d9b5;
      }

      .box:nth-child(n + 17):nth-child(-n + 24):nth-child(even) {
        background: #b58863;
      }

      /* 4-р мөр */
      .box:nth-child(n + 25):nth-child(-n + 32):nth-child(odd) {
        background: #b58863;
      }

      .box:nth-child(n + 25):nth-child(-n + 32):nth-child(even) {
        background: #f0d9b5;
      }

      /* 5-р мөр */
      .box:nth-child(n + 33):nth-child(-n + 40):nth-child(odd) {
        background: #f0d9b5;
      }

      .box:nth-child(n + 33):nth-child(-n + 40):nth-child(even) {
        background: #b58863;
      }

      /* 6-р мөр */
      .box:nth-child(n + 41):nth-child(-n + 48):nth-child(odd) {
        background: #b58863;
      }

      .box:nth-child(n + 41):nth-child(-n + 48):nth-child(even) {
        background: #f0d9b5;
      }

      /* 7-р мөр */
      .box:nth-child(n + 49):nth-child(-n + 56):nth-child(odd) {
        background: #f0d9b5;
      }

      .box:nth-child(n + 49):nth-child(-n + 56):nth-child(even) {
        background: #b58863;
      }

      /* 8-р мөр */
      .box:nth-child(n + 57):nth-child(-n + 64):nth-child(odd) {
        background: #b58863;
      }

      .box:nth-child(n + 57):nth-child(-n + 64):nth-child(even) {
        background: #f0d9b5;
      }
    </style>
  </head>

  <body>
    <div class="chess">
      <!-- 1 -->
      <div class="box">♜</div>
      <div class="box">♞</div>
      <div class="box">♝</div>
      <div class="box">♛</div>
      <div class="box">♚</div>
      <div class="box">♝</div>
      <div class="box">♞</div>
      <div class="box">♜</div>

      <!-- 2 -->
      <div class="box">♟</div>
      <div class="box">♟</div>
      <div class="box">♟</div>
      <div class="box">♟</div>
      <div class="box">♟</div>
      <div class="box">♟</div>
      <div class="box">♟</div>
      <div class="box">♟</div>

      <!-- 3 -->
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>

      <!-- 4 -->
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>

      <!-- 5 -->
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>

      <!-- 6 -->
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>

      <!-- 7 -->
      <div class="box">♙</div>

      <div class="box">♙</div>
      <div class="box">♙</div>

      <!-- 8 -->
      <div class="box">♖</div>

      <div class="box">♖</div>
    </div>
  </body>
</html>
