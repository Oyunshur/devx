<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: arial, sans-serif;
      }

      body {
        background: #f2f4f7;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .register-box {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      .register-box h2 {
        /* text-align: center; */
        margin-bottom: 25px;
        color: #72f75a;
      }

      .input-group {
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 7px;
        color: #444;
        font-weight: bold;
      }

      .input-group input[type="text"],
      .input-group input[type="email"],
      .input-group input[type="password"],
      .input-group input[type="number"] {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
      }

      .input-group input:focus {
        border-color: #4a90e2;
      }

      .gender {
        margin-bottom: 18px;
      }
      .gender select {
        width: 100%;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
      }

      .gender label {
        margin-right: 15px;
        color: #444;
      }

      .terms {
        margin-bottom: 20px;
      }

      .terms label {
        color: #555;
        font-size: 14px;
      }

      .register-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #72f75a;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .register-btn:hover {
        background: #72f75a;
      }

      .register-btn:disabled {
        background: #72f75a;
        cursor: not-allowed;
      }

      #message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="register-box">
      <h2>Create Account</h2>

      <form id="registerForm">
        <div class="input-group">
          <label for="firstname"> First Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your first name"
            required
          />
        </div>
        <div class="input-group">
          <label for="lastname">Last Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your last name"
            required
          />
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="input-group">
          <label for="repeatPassword">Repeat Password</label>
          <input
            type="password"
            id="repeatPassword"
            placeholder="Repeat your password"
            required
          />
        </div>
        <div class="input-group">
          <label for="contact">Contact</label>
          <input
            type="number"
            id="contact"
            placeholder="Enter your contact"
            required
          />
        </div>

        <div class="gender">
          <label>Gender</label><br /><br />
          <select>
            <option value="">Male</option>
            <option value="">Female</option>
            <option value="">Other</option>
          </select>
        </div>

        <div class="terms">
          <input type="checkbox" id="terms" />
          <label for="terms"> I agree to the terms and conditions </label>
        </div>

        <button type="submit" class="register-btn" id="registerBtn" disabled>
          Register
        </button>

        <p id="message"></p>
      </form>
    </div>
  </body>
</html>
