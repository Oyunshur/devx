<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive profile card inspired by Dribbble design with multi-layer wave divider, custom avatar, social links, subscribe button, and mouse-reactive parallax background.">
  <title>Interactive Profile Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Interactive Parallax Background -->
  <div class="interactive-bg" id="interactiveBg" aria-hidden="true">
    <canvas id="bgCanvas"></canvas>
    <div class="glow-orb orb-1" id="orb1"></div>
    <div class="glow-orb orb-2" id="orb2"></div>
    <div class="glow-orb orb-3" id="orb3"></div>
    <div class="glow-orb orb-4" id="orb4"></div>
  </div>

  <main class="page-container">
    <div class="card-perspective-wrapper" id="cardWrapper">
      <article class="profile-card" id="profileCard">
        <!-- Interactive Sheen / Glare layer -->
        <div class="card-glare" id="cardGlare" aria-hidden="true"></div>

        <!-- Top Header with Rose Gradient & Avatar -->
        <div class="card-header">
          <div class="header-overlay" aria-hidden="true"></div>
          
          <!-- Avatar Frame -->
          <div class="avatar-wrapper">
            <div class="avatar-ring">
              <img 
                src="avatar.png" 
                alt="Lautre Laure profile portrait" 
                class="avatar-img"
                width="128" 
                height="128"
                loading="eager"
              >
            </div>
          </div>

          <!-- Multi-Layer Fluid Overlapping Waves -->
          <div class="waves-wrapper" aria-hidden="true">
            <svg class="wave-layer wave-amber" viewBox="0 0 500 120" preserveAspectRatio="none">
              <path d="M 0,35 Q 120,85 240,40 T 500,60 L 500,120 L 0,120 Z"></path>
            </svg>
            <svg class="wave-layer wave-teal" viewBox="0 0 500 120" preserveAspectRatio="none">
              <path d="M 0,55 Q 140,15 270,70 T 500,45 L 500,120 L 0,120 Z"></path>
            </svg>
            <svg class="wave-layer wave-white" viewBox="0 0 500 120" preserveAspectRatio="none">
              <path d="M 0,72 Q 130,42 260,82 T 500,62 L 500,120 L 0,120 Z"></path>
            </svg>
          </div>
        </div>

        <!-- Card Body Content -->
        <div class="card-body">
          <header class="profile-meta">
            <h1 class="profile-name">Lautre Laure</h1>
            <p class="profile-handle">@lautrelaure</p>
          </header>

          <!-- Social Links Nav -->
          <nav class="social-nav" aria-label="Social media profiles">
            <a href="https://behance.net" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Behance" title="Behance">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M8.22 13.06c-1.39 0-1.8.84-1.87 1.48h3.63c-.04-.64-.4-1.48-1.76-1.48zm-1.87-2.31h3.49c-.06-.57-.42-1.28-1.63-1.28-1.18 0-1.74.69-1.86 1.28zm10.74 3.79c-.31.39-.77.58-1.39.58-.8 0-1.36-.45-1.57-1.25h3.48c.03-.22.04-.45.04-.67 0-2.33-1.48-3.79-3.74-3.79-2.31 0-3.87 1.63-3.87 3.86 0 2.29 1.54 3.86 3.97 3.86 1.49 0 2.68-.61 3.32-1.74l-.24-.85zm-1.84-3.41c.64 0 1.05.34 1.22.84h-2.5c.2-.53.64-.84 1.28-.84zM15.4 7.6h3.2v.9h-3.2zm-9.05.02H2.2v8.78h4.15c2.3 0 3.7-1.07 3.7-2.67 0-1.05-.62-1.92-1.66-2.22.84-.33 1.37-1.08 1.37-2.02 0-1.47-1.23-2.36-3.41-2.36z"/>
              </svg>
            </a>
            <a href="https://dribbble.com" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Dribbble" title="Dribbble">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c5.51 0 10-4.48 10-10S17.51 2 12 2zm6.605 4.61a8.502 8.502 0 011.93 5.312c-.28-.058-2.61-.532-5.186-.231-.054-.123-.112-.246-.17-.37-.502-1.077-1.082-2.12-1.74-3.125 2.656-1.01 4.757-1.503 5.166-1.586zm-6.605-2.61c2.14 0 4.09.79 5.58 2.09-.43.1-2.45.6-5.02 1.57-1.12-2.02-2.37-3.47-2.66-3.79.67-.18 1.38-.27 2.1-.27zM7.55 4.24c.27.3.1.51 2.37 3.49-1.39.46-3.79 1.45-6.02 2.76A8.528 8.528 0 017.55 4.24zM3.48 12c0-.14.01-.27.02-.41 2.18-1.28 4.54-2.25 5.92-2.7 1.05 1.94 1.95 3.99 2.68 6.13-3.62 1.07-6.81.42-8.31.06A8.56 8.56 0 013.48 12zm8.52 8.5c-2.05 0-3.93-.73-5.39-1.95 1.36-.32 4.14-.85 7.42-1.85.39 1.05.74 2.12 1.04 3.21a8.47 8.47 0 01-3.07.59zm4.84-1.32c-.29-1.03-.62-2.04-.99-3.04 2.45-.33 4.6.09 4.9.15a8.552 8.552 0 01-3.91 2.89z"/>
              </svg>
            </a>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="GitHub" title="GitHub">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Instagram" title="Instagram">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
              </svg>
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Twitter / X" title="Twitter / X">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
            </a>
          </nav>

          <!-- Bio / Job Description -->
          <div class="profile-job-info">
            <p class="profile-job">INTP • Brand & Communication Strategy</p>
            <p class="profile-description">
              Graphic design, illustration, art direction and creative research. Creative at Superblaise.
            </p>
          </div>

          <!-- Subscribe Action -->
          <div class="card-action">
            <button 
              type="button" 
              class="subscribe-btn" 
              id="subscribeBtn" 
              aria-pressed="false"
              aria-label="Subscribe to updates"
            >
              <span class="btn-icon icon-subscribe" aria-hidden="true">
                <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                  <path d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/>
                </svg>
              </span>
              <span class="btn-icon icon-check" aria-hidden="true">
                <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                  <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
              </span>
              <span class="btn-text" id="btnText">Subscribe</span>
            </button>
          </div>
        </div>
      </article>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
